services:
  sysbox-agent:
    image: ${SYSBOX_IMAGE:-sysbox:latest}
    container_name: sysbox-agent
    restart: unless-stopped
    user: "${SYSBOX_AGENT_UID:-32000}:${SYSBOX_AGENT_GID:-32000}"
    # The identity URL must be reachable by both this worker and the host service.
    network_mode: host
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    depends_on:
      sysbox-api:
        condition: service_started
    entrypoint:
      - sysbox
    command:
      - agent
      - start
      - --identity
      - /var/lib/sysbox-agent/identity.json
      - --config
      - /etc/sysbox-worker/agent.yaml
    volumes:
      - type: bind
        source: ${SYSBOX_AGENT_DATA_DIR:-/var/lib/sysbox-agent}
        target: /var/lib/sysbox-agent
        bind:
          create_host_path: false
      - type: bind
        source: ${SYSBOX_HOST_SOCKET_DIR:-/run/sysbox-host}
        target: /run/sysbox-host
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SYSBOX_WORKER_CONFIG_DIR:-/etc/sysbox-worker}
        target: /etc/sysbox-worker
        read_only: true
        bind:
          create_host_path: false
    environment:
      SYSBOX_CONFIG: /etc/sysbox-worker/agent.yaml
